<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delgash Gaming PS4 Host</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            /* وێنەی پشتەوە؛ دەتوانیت لینکی وێنەی خۆت لە شوێنی 'bg.jpg' دابنێیت */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        /* بەشی ناوەڕاست و نووسینەکان */
        .header {
            margin-bottom: 25px;
            text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .header h1 {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header .phone {
            font-size: 13px;
            color: #00d2ff;
            margin: 3px 0;
            direction: ltr;
        }

        .header .by {
            font-size: 11px;
            color: #cccccc;
        }

        /* دوگمەی بازنەیی Jailbreak */
        .jb-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid #00d2ff;
            box-shadow: 0 0 15px #00d2ff, inset 0 0 15px #00d2ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .jb-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00d2ff, inset 0 0 25px #00d2ff;
        }

        .jb-button svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            margin-bottom: 5px;
        }

        .jb-button span {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* دەقی باری سێرڤەر */
        .status {
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #00d2ff;
            letter-spacing: 1px;
            text-shadow: 0px 1px 5px rgba(0, 0, 0, 0.8);
        }

        /* بژاردەی Auto JB */
        .auto-jb {
            margin-top: 8px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Delgash-Gaming</h1>
        <div class="phone">🕿 0750 427 0137</div>
        <div class="phone">🕿 0750 777 9532</div>
        <div class="by">by Delgash Gaming</div>
    </div>

    <!-- دوگمەی سەرەکی Jailbreak -->
    <a class="jb-button" onclick="loadGoldHen()">
        <svg viewBox="0 0 24 24">
            <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zM18 13h-2.18c-.41-1.16-1.51-2-2.82-2h-3c-1.31 0-2.41.84-2.82 2H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h13c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2z"/>
        </svg>
        <span>JAILBREAK</span>
    </a>

    <div class="status" id="status">READY</div>

    <div class="auto-jb">
        <input type="checkbox" id="autojb">
        <label for="autojb">AUTO JB</label>
    </div>

    <script>
        function loadGoldHen() {
            document.getElementById('status').innerText = 'LOADING EXPLOIT...';
            // لێرەدا فەنکشنی بارکردنی GoldHEN دەبەسترێتەوە
        }
    </script>

</body>
</html>
